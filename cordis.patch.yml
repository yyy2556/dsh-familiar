- insert:
    - id: remember
      name: 'dsh-familiar-memory'
      config:
        enabled: true
        autoInject: true
        injectMode: auto
        injectBudgetChars: 1100
        cardScoreThreshold: 0.30
        indexLimit: 400
        profileMaxChars: 500
        injectMaxFacts: 4
        injectCorrectionSlots: 2
        maintainThreshold: 120
        autoConsolidate: true
        debug: true
